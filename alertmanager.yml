global:
  resolve_timeout: 5m

route:
  receiver: "slack-notifications"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
- name: "slack-notifications"
  slack_configs:
  - api_url: "https://hooks.slack.com/services/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"
    channel: "#alerts"
    send_resolved: true
    title: "{{ .CommonAnnotations.summary }}"
    text: >-
      {{ range .Alerts }}
      *Alert:* {{ .Annotations.description }}
      *Status:* {{ .Status }}
      *StartsAt:* {{ .StartsAt }}
      {{ end }}
